name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Node is pinned, not inherited. ubuntu-latest currently defaults to Node 20,
      # whose npm 10 crashes resolving vitest's peer set
      # (`Cannot read properties of null (reading 'edgesOut')`) — which is why every
      # deploy failed from 2026-10-08 on, leaving the live site stale. Pinning also
      # keeps the install from changing underneath us when GitHub moves that default.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # Node 24 ships npm 11, but only from 11.6.0: 11.5.2 and every 10.x still
      # crash on this tree, and setup-node has no npm-version input, so the exact
      # npm has to be named here. `^11.6.0` keeps us on the line CI is tested
      # against while taking the fixes above the floor.
      - name: Pin npm
        run: npm install -g "npm@^11.6.0"

      # package-lock.json is intentionally not tracked, so this is `npm install`
      # rather than `npm ci`.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # The region overlay is a committed artifact generated from a live wiki, so
      # it goes stale the moment a region page gains a ==Resources== heading or a
      # resource. This re-mines the canonical pages (through the generator's own
      # 1 req/s) and fails the deploy instead of shipping an overlay the repo no
      # longer matches; a page the run cannot fetch is reported as unjudged rather
      # than as drift, so a wiki blip cannot block a release. To fix a real
      # failure: node scripts/build-region-resources.mjs, commit the result.
      - name: Check the region overlay is current (drift guard)
        run: node scripts/build-region-resources.mjs --check

      # The live-map overlay is the same kind of committed artifact, with one
      # difference: its ~4.7 MB source is gitignored (the host refuses scripted
      # downloads), so CI usually has no reference to compare against. The check
      # still runs the half that needs no source — every linked node id must exist
      # in data.json, every filter must name a type the artifact carries, every
      # view must be a real place — and reports the comparison as unjudged rather
      # than failing over someone else's downtime. To fix a real failure:
      # node scripts/build-map-links.mjs, commit the result.
      - name: Check the live-map overlay still describes this dataset
        run: node scripts/build-map-links.mjs --check

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      # The base path is taken from Pages itself instead of being hard-coded, so
      # a rename, a custom-domain change or a move to a user page needs no edit.
      - name: Build (vite build → dist/)
        run: npm run build
        env:
          PAGES_BASE: ${{ steps.pages.outputs.base_path }}

      # Bundled JS/CSS land in dist/assets/, everything else (vendor bundles,
      # icons, the generated data files, the layout worker) is copied verbatim
      # from public/. dist/ is gitignored and rebuilt on every run.
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # expose the deployed URL to the smoke job below (job-level outputs are not
    # inferred from a step's id — the smoke job reads needs.deploy.outputs.page_url)
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # The suite runs against SOURCES locally (Vite dev server) and against the
  # BUILD here, which is the only place the minified, base-prefixed bundle is
  # exercised end to end. scripts/test-ui.mjs --url=... exists for exactly this.
  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # same Node + npm pin as the build job — this job installs too, and the
      # runner's default npm 10 crashes it the same way
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Pin npm
        run: npm install -g "npm@^11.6.0"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Smoke-test the deployed build
        run: node scripts/test-ui.mjs --url=${{ needs.deploy.outputs.page_url }} smoke
